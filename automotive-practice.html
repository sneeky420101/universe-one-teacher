<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe One | Automotive Practice</title><style>body{font:18px system-ui;background:#10213c;color:#fff;max-width:850px;margin:auto;padding:88px 20px 30px}section{background:#1e3655;border-radius:18px;padding:22px;margin:14px 0}button{font:inherit;background:#73e2c7;color:#092c2a;border:0;border-radius:12px;padding:16px;margin:6px;cursor:pointer;min-height:52px}button:focus-visible,a:focus-visible{outline:3px solid #ffdd77}#home{position:fixed;top:10px;left:10px;width:64px;height:64px;border-radius:50%;background:#102d52;border:2px solid #70dfd7}#home img{width:100%}.choices{display:flex;flex-wrap:wrap}#message{min-height:2em}small{color:#c7d9e7}</style><a id="home" href="./index.html" title="Go home" aria-label="Go home"><img src="./universe-home-logo.svg" alt=""></a><h1>🔧 Automotive Learning Mission</h1><p>Five guided learning actions. Mistakes explain what to try next. This is a conceptual simulation, not real-world repair certification.</p><section><h2 id="task">Ready to begin?</h2><p id="reading"></p><div class="choices" id="choices"></div><p id="message" role="status" aria-live="polite"></p><p id="progress"></p><button id="restart">Start a new mission</button></section><p><a href="./workshop-3d.html" style="color:#a2eaff">Explore 3D workshop</a></p><script>
let id='',state=null;const $=x=>document.getElementById(x);
const steps=[{title:'1. Inspect the battery',choices:[['Inspect battery',{type:'inspect',target:'battery'}],['Inspect engine',{type:'inspect',target:'engine'}]]},{title:'2. Check the reading',choices:[['Use voltmeter',{type:'measure',tool:'voltmeter'}],['Use hammer',{type:'measure',tool:'hammer'}]]},{title:'3. Isolate the training circuit',choices:[['Use insulated training wrench',{type:'isolate',tool:'insulated-wrench'}],['Skip to replacement',{type:'replace',part:'terminal'}]]},{title:'4. Replace the simulated terminal',choices:[['Replace terminal',{type:'replace',part:'terminal'}],['Verify without replacing',{type:'verify',tool:'voltmeter'}]]},{title:'5. Verify the result',choices:[['Measure with voltmeter',{type:'verify',tool:'voltmeter'}],['Inspect only',{type:'inspect',target:'battery'}]]}];
async function send(input){try{const res=await fetch('./api/practice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)});const data=await res.json();if(!res.ok)throw Error(data.error||'Unavailable');if(data.id)id=data.id;if(data.state)state=data.state;render();if(data.message)$('message').textContent=data.message}catch(e){$('message').textContent='Could not continue: '+e.message}}
function render(){if(!state)return;const done=state.phase==='complete';$('task').textContent=done?'🎓 Mission complete!':steps[state.step].title;$('reading').textContent='Simulated reading: '+state.voltage.toFixed(1)+' V | Training component: '+state.part;$('progress').textContent='Steps: '+state.step+'/5 · Score: '+state.score+' · Retries: '+state.attempts;$('choices').replaceChildren();if(done){$('message').textContent='You finished the guided mission. Great work!';return}for(const [label,input] of steps[state.step].choices){const b=document.createElement('button');b.textContent=label;b.onclick=()=>send({id,...input});$('choices').append(b)}}
$('restart').onclick=()=>send({type:'new'});send({type:'new'});
</script></html>
