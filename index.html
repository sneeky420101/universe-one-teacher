<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe One AI Teacher</title><style>body{font:16px system-ui;background:#101b33;color:#f2f5ff;margin:0}header,main{max-width:800px;margin:auto;padding:20px}section{background:#1b2a49;border:1px solid #4a6087;border-radius:14px;padding:20px;margin:16px 0}button,input{font:inherit;padding:12px;border-radius:8px}button{background:#78e2c3;color:#082124;border:0;cursor:pointer;margin:5px}input{max-width:95%;width:550px;background:#101b33;color:white;border:1px solid #9caec9}a{color:#a6d6ff}button:focus-visible,input:focus-visible{outline:3px solid #fff}.choice{display:block;text-align:left;width:100%;background:#30456d;color:white}p{line-height:1.5}small{color:#bccbe5}</style><header><h1>🌎 Universe One AI Teacher</h1><p>Explore eight source-backed lessons and practice with quizzes. This is an educational preview, not a generative AI tutor.</p></header><main><section><h2>Progress</h2><p id="progress"></p></section><section><h2>Ask about a lesson</h2><form id="ask"><input id="question" required maxlength="250" aria-label="Your question" placeholder="What is gravity?"><button>Find answer</button></form><p id="response" role="status"></p></section><div id="lessons"></div><small>No account required. Quiz progress is stored on this device only.</small></main><script>
const lessons=[
["earth","Planet Earth","Earth is the third planet from the Sun. Earth rotates about once every 24 hours and orbits the Sun in about 365.25 days.","https://science.nasa.gov/earth/facts/","Which planet is third from the Sun?",["Venus","Earth","Mars"],1],
["water","The Water Cycle","Water evaporates, condenses into clouds, and returns as precipitation. Water also moves through runoff and groundwater.","https://www.usgs.gov/special-topics/water-science-school/science/water-cycle","What is water vapor cooling into droplets called?",["Condensation","Evaporation","Erosion"],0],
["fractions","Understanding Fractions","A fraction represents part of a whole. In 1/2, 1 is the numerator and 2 is the denominator. Two halves make one whole.","https://www.khanacademy.org/math/arithmetic/fraction-arithmetic","What is 1/2 + 1/2?",["1/4","1","2"],1],
["moon","The Moon","The Moon is Earth's natural satellite. Its changing appearance from Earth is caused by our changing view of its sunlit half.","https://science.nasa.gov/moon/facts/","What causes Moon phases?",["Earth's shadow every night","Our changing view of the sunlit Moon","Clouds"],1],
["weather","Weather and Climate","Weather describes short-term atmospheric conditions. Climate describes typical weather patterns over longer periods, often 30 years or more.","https://www.ncei.noaa.gov/news/weather-vs-climate","Which describes long-term weather patterns?",["Climate","Today's forecast","One storm"],0],
["gravity","Gravity","Gravity is an attractive interaction between objects with mass. Earth's gravity pulls objects toward its center and helps keep the Moon in orbit.","https://science.nasa.gov/solar-system/what-is-gravity/","What keeps the Moon in orbit?",["Sound","Gravity","Wind"],1],
["ecosystems","Ecosystems","An ecosystem includes living organisms and the nonliving environment interacting in an area. Many ecosystems get energy from sunlight.","https://www.nationalgeographic.org/encyclopedia/ecosystem/","Which is nonliving?",["A tree","A mushroom","Sunlight"],2],
["measurement","Metric Measurement","One kilometer equals 1,000 meters. One centimeter equals one hundredth of a meter.","https://www.nist.gov/pml/owm/metric-si/si-units-length","How many meters are in a kilometer?",["100","1,000","10,000"],1]];
const host=document.getElementById('lessons');let done={};try{done=JSON.parse(localStorage.getItem('universe-one-progress')||'{}')}catch{};function update(){document.getElementById('progress').textContent=Object.values(done).filter(Boolean).length+' of '+lessons.length+' quizzes passed'}update();lessons.forEach(l=>{const s=document.createElement('section');const h=document.createElement('h2');h.textContent=l[1];s.append(h);const p=document.createElement('p');p.textContent=l[2];s.append(p);const a=document.createElement('a');a.href=l[3];a.target='_blank';a.rel='noopener noreferrer';a.textContent='Read source';s.append(a);const q=document.createElement('h3');q.textContent=l[4];s.append(q);const feedback=document.createElement('p');feedback.setAttribute('role','status');l[5].forEach((choice,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>{const correct=i===l[6];feedback.textContent=correct?'Correct!':'Not quite. Review and try again.';if(correct){done[l[0]]=true;try{localStorage.setItem('universe-one-progress',JSON.stringify(done))}catch{}update()}};s.append(b)});s.append(feedback);host.append(s)});
document.getElementById('ask').onsubmit=e=>{e.preventDefault();const q=document.getElementById('question').value.toLowerCase();const words=(q.match(/[a-z]{3,}/g)||[]).filter(w=>!['what','which','where','when','does','this','that','about','tell','please','explain','how','the','and','are','can','why','with','from'].includes(w));const ranked=lessons.map(l=>({l,score:words.filter(w=>(l[1]+' '+l[2]).toLowerCase().includes(w)).length})).sort((a,b)=>b.score-a.score);const out=document.getElementById('response');out.replaceChildren();if(!words.length||!ranked[0].score){out.textContent='I do not have a verified answer in these eight lessons. Try another topic.';return}const l=ranked[0].l;out.textContent=l[2]+' ';const a=document.createElement('a');a.href=l[3];a.textContent='Source';a.target='_blank';a.rel='noopener noreferrer';out.append(a)};
</script></html>
