<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe One — Playable 3D Simulation Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071421;color:#eef7ff;font:15px system-ui}header{padding:12px 18px;background:#0e293c;display:flex;gap:16px;align-items:center;flex-wrap:wrap}a{color:#9de9fa}h1{font-size:20px;margin:0}#hud{position:absolute;top:82px;left:12px;max-width:360px;background:#071a2ddd;padding:14px;border:1px solid #548fa5;border-radius:12px;z-index:2}#hud h2{margin:0 0 8px;font-size:17px}#hud p{margin:7px 0}button,select{background:#164b68;color:white;border:1px solid #6ac4dd;border-radius:8px;padding:10px;cursor:pointer;font:inherit}button:focus-visible,select:focus-visible{outline:3px solid #ffdd7d}#game{width:100%;height:calc(100dvh - 64px);display:block;touch-action:none}#controls{position:absolute;bottom:16px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;min-width:48px;background:#10334fe9}#question{position:absolute;right:12px;top:82px;max-width:310px;background:#071a2df0;border:1px solid #6ac4dd;border-radius:12px;padding:12px;z-index:3}#question button{display:block;width:100%;margin:6px 0;text-align:left}#question[hidden]{display:none}#status{color:#b7ffcf}small{color:#b9d4e0}@media(max-width:650px){#hud{top:70px;max-width:245px;font-size:12px;padding:9px}#question{top:auto;bottom:95px;left:12px;right:12px;max-width:none}header{gap:7px}h1{font-size:15px}}

/* Large touch controls and readable mobile HUD */
body{font-size:19px;line-height:1.45}header{padding:14px;gap:12px}header a{font-size:19px}h1{font-size:24px}button,select{font-size:20px;min-height:60px;padding:12px 16px}#hud{font-size:18px;max-width:min(440px,calc(100vw - 24px))}#hud h2{font-size:23px}#question{font-size:19px;max-width:min(440px,calc(100vw - 24px))}#question button{font-size:20px;min-height:60px}#controls{gap:12px;bottom:max(12px,env(safe-area-inset-bottom))}#controls>div{display:flex;flex-wrap:wrap;gap:8px}#controls button{font-size:23px;min-width:66px;min-height:66px;padding:12px}#controls #interact,#controls #reset{font-size:19px}small{font-size:16px}#game{height:calc(100dvh - 90px)}
@media(max-width:650px){header{padding:10px 12px}h1{font-size:21px}#hud{position:relative;top:auto;left:auto;max-width:none;margin:8px 12px;padding:12px;font-size:18px}#hud h2{font-size:22px}#hud small{display:block;font-size:15px}#game{height:55dvh;min-height:360px}#controls{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));justify-content:space-between;z-index:5}#controls>div{gap:5px}#controls button{min-width:58px;min-height:62px;font-size:23px;padding:8px}#controls #interact,#controls #reset{font-size:17px;min-width:84px}#question{position:fixed;top:auto;bottom:96px;left:8px;right:8px;max-height:55dvh;overflow:auto;padding:14px}#question button{font-size:20px}body{padding-bottom:90px}}

/* Dual analog sticks */
#controls{position:fixed;z-index:10;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;flex-wrap:nowrap;pointer-events:none}#controls .stick{width:clamp(100px,26vw,148px);height:clamp(100px,26vw,148px);border:3px solid #8adcf1;border-radius:50%;background:#103a55dc;display:grid;place-items:center;touch-action:none;pointer-events:auto;user-select:none}#controls .knob{width:46%;height:46%;border-radius:50%;background:#78d8ef;border:3px solid white;pointer-events:none}#controls .actions{display:flex;flex-direction:column;gap:8px;pointer-events:auto}#controls .actions button{min-width:82px;min-height:56px;font-size:17px}#controls .stick-group{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:15px;pointer-events:auto}@media(max-width:650px){#controls .stick{width:clamp(94px,27vw,130px);height:clamp(94px,27vw,130px)}#controls .actions button{min-width:72px;padding:8px;font-size:15px}}
</style></head><body><header><a href="./index.html">⌂ Universe One Home</a><h1>Playable 3D Simulation Lab</h1><label>Scenario <select id="scenario"><option value="auto">Automotive service</option><option value="construction">Excavator safety</option><option value="medical">Anatomy lab</option></select></label></header>
<canvas id="game" aria-label="Interactive 3D simulation world"></canvas>
<section id="hud"><h2 id="title">Loading 3D world…</h2><p id="objective"></p><p id="selected">Select a highlighted object.</p><p id="status" role="status" aria-live="polite"></p><p id="progress"></p><small>WASD / arrows: move · drag: look · tap: select · E: interact. Training simulation only; not certification.</small></section>
<section id="question" hidden><h3 id="questionTitle"></h3><p id="questionText"></p><div id="answers"></div></section>
<div id="controls"><div class="stick-group"><span>MOVE</span><div id="moveStick" class="stick" aria-label="Movement joystick"><div class="knob"></div></div></div><div class="actions"><button id="interact">Interact</button><button id="reset">Restart</button></div><div class="stick-group"><span>LOOK</span><div id="lookStick" class="stick" aria-label="Camera joystick"><div class="knob"></div></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=id=>document.getElementById(id),canvas=$('game');
let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(error){document.body.innerHTML='<main style="padding:24px;font:18px system-ui;color:white;background:#14283d;min-height:100vh"><h1>3D graphics unavailable</h1><p>Enable hardware acceleration or try an updated browser with WebGL support.</p><a style="color:#9de9fa" href="./index.html">Return to Universe One</a></main>';throw error;}renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#152b40');scene.fog=new THREE.Fog('#152b40',20,55);
const camera=new THREE.PerspectiveCamera(70,1,.1,100);camera.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xc8e8ff,0x334451,2));
const sun=new THREE.DirectionalLight(0xffe9cb,3);sun.position.set(8,15,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const material=(color,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness:.6,metalness});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(48,48),material('#41505a'));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(48,48,0x6b8794,0x536674);grid.position.y=.008;scene.add(grid);
const world=new THREE.Group();scene.add(world);let objects=[],target=null,mode='auto',yaw=0,pitch=0,pressed=new Set(),drag=null,completed=new Set(),correct=new Set(),attempted=new Set(),actions=new Set();
const scenarios={
auto:{title:'Automotive Service Bay',objective:'Walk to the vehicle, inspect the wheels and engine, then complete safety checks.',items:[
{name:'Front wheel',x:-2,z:-2,color:'#242a34',shape:'cylinder',question:'What is appropriate when a tire has a visible defect?',answers:['Document and escalate it','Ignore it','Drive faster'],correct:0,feedback:'Defects require appropriate inspection by trained personnel.'},
{name:'Engine compartment',x:0,z:-3,color:'#b36b36',shape:'box',question:'What should happen before inspecting a hot engine?',answers:['Touch hot parts','Follow safe cooldown and inspection procedures','Add random fluids'],correct:1,feedback:'Hot and moving components require appropriate precautions.'},
{name:'Rear wheel',x:2,z:-2,color:'#242a34',shape:'cylinder',question:'Who should perform safety-critical wheel service?',answers:['Untrained visitors','Qualified personnel following specifications','Anyone without tools'],correct:1,feedback:'Use manufacturer-specific procedures and qualified personnel.'}]},
construction:{title:'Excavator Safety Yard',objective:'Explore the machine and identify safe working practices before operating equipment.',items:[
{name:'Operator cab',x:-2,z:-3,color:'#e7af32',shape:'box',question:'Before operating unfamiliar equipment you should…',answers:['Guess the controls','Receive model-specific supervised training','Start at full power'],correct:1,feedback:'Training and authorization are required.'},
{name:'Boom assembly',x:0,z:-3,color:'#e5a523',shape:'beam',question:'If a person enters the exclusion zone, what should happen?',answers:['Stop work safely','Continue','Swing faster'],correct:0,feedback:'Keep the machine working area clear.'},
{name:'Bucket',x:2,z:-3,color:'#798a93',shape:'box',question:'How should critical fault warnings be handled?',answers:['Ignore them','Increase speed','Follow safe-stop and reporting procedure'],correct:2,feedback:'Never bypass safety warnings.'}]},
medical:{title:'Human Anatomy Lab',objective:'Explore the anatomical models and practice foundational patient safety.',items:[
{name:'Heart model',x:-2,z:-3,color:'#cf5369',shape:'sphere',question:'Which chamber pumps blood to the systemic circulation?',answers:['Right atrium','Left ventricle','Trachea'],correct:1,feedback:'The left ventricle supplies the systemic circulation.'},
{name:'Brain model',x:0,z:-3,color:'#bb88c9',shape:'sphere',question:'Which structure contains the cerebellum?',answers:['Heart','Brain','Liver'],correct:1,feedback:'The cerebellum contributes to movement coordination.'},
{name:'Safety station',x:2,z:-3,color:'#5bbfa7',shape:'box',question:'A patient identifier does not match the chart. What next?',answers:['Proceed','Guess the correct record','Pause and resolve the mismatch'],correct:2,feedback:'Correct identification is a fundamental safety practice.'}]}
};
const procedures={
auto:[['Secure vehicle','Inspect tire condition','Record inspection'],['Confirm engine is cool','Inspect visible components','Record condition'],['Check wheel area','Inspect visible damage','Record inspection']],
construction:[['Confirm equipment is isolated','Inspect cab and controls','Record cab inspection'],['Establish exclusion zone','Inspect boom from safe position','Record inspection'],['Verify machine is secured','Inspect bucket condition','Record defects']],
medical:[['Identify the heart model','Inspect chambers','Record finding'],['Identify the brain model','Inspect major structures','Record finding'],['Confirm patient identity','Verify matching records','Record safety check']]
};
let procedureSteps=new Map();
function procedureLabel(index){const step=procedureSteps.get(index)||0;const steps=procedures[mode][index];return steps[Math.min(step,steps.length-1)]}
function mesh(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;world.add(m);return m}
function build(){while(world.children.length)world.remove(world.children[0]);objects=[];target=null;completed.clear();correct.clear();attempted.clear();actions.clear();procedureSteps.clear();$('question').hidden=true;
const s=scenarios[mode];$('title').textContent=s.title;$('objective').textContent=s.objective;$('status').textContent='World ready. Walk toward the glowing equipment markers, tap a component, and press Interact to perform its procedure.';$('selected').textContent='No object selected.';
for(let i=0;i<6;i++){mesh(new THREE.BoxGeometry(.2,4,.2),material('#7d929c'),-8+i*3.2,2,-9);mesh(new THREE.BoxGeometry(2.6,.1,.6),material('#d2ecf4'),-8+i*3.2,4,-9)}
mesh(new THREE.BoxGeometry(10,.3,2.2),material('#263f4e'),0,.15,-3.5);
s.items.forEach((item,i)=>{let geo=item.shape==='sphere'?new THREE.SphereGeometry(.7,24,16):item.shape==='cylinder'?new THREE.CylinderGeometry(.68,.68,.42,24):item.shape==='beam'?new THREE.BoxGeometry(2.4,.3,.45):new THREE.BoxGeometry(1.25,1.3,1);
const m=mesh(geo,material(item.color,.15),item.x,item.shape==='beam'?2:1.15,item.z);if(item.shape==='cylinder')m.rotation.z=Math.PI/2;
const marker=mesh(new THREE.SphereGeometry(.17,16,12),new THREE.MeshStandardMaterial({color:0xffdd66,emissive:0xffaa00,emissiveIntensity:2}),item.x,2.6,item.z);m.userData.index=i;marker.userData.index=i;objects.push({item,m,marker})});
camera.position.set(0,1.7,6);yaw=0;pitch=0;updateProgress()}
function updateProgress(){const n=scenarios[mode].items.length,passed=correct.size===n&&actions.size===n;$('progress').textContent='Objects inspected: '+completed.size+'/'+n+' · Correct checks: '+correct.size+'/'+n+' · Hands-on actions: '+actions.size+'/'+n+(passed?' · Mission passed!':'');if(passed){$('status').textContent='Mission complete! All three inspections and knowledge checks passed. Choose another scenario to continue training.';try{const key='universe-one-completed-missions';const saved=JSON.parse(localStorage.getItem(key)||'{}');saved[mode]=new Date().toISOString();localStorage.setItem(key,JSON.stringify(saved))}catch{}}}
function choose(i){const obj=objects[i];if(!obj)return;if(camera.position.distanceTo(obj.m.position)>4.5){$('status').textContent='Walk closer to the component before inspecting it.';return}target=i;completed.add(i);$('selected').textContent='Selected: '+obj.item.name;obj.marker.material.color.set('#53eaa1');$('status').textContent='Selected '+obj.item.name+'. Begin procedure: '+procedureLabel(i)+'.';updateProgress()}
function interact(){if(target===null){$('status').textContent='Select a nearby highlighted component first.';return}const index=target,obj=objects[index],item=obj.item;if(camera.position.distanceTo(obj.m.position)>4.5){$('status').textContent='Move closer before interacting.';return}if(!actions.has(index)){const steps=procedures[mode][index],step=procedureSteps.get(index)||0;procedureSteps.set(index,step+1);if(step+1<steps.length){$('status').textContent='Step '+(step+1)+'/'+steps.length+' complete: '+steps[step]+'. Next: '+steps[step+1]+'.';return}actions.add(index);obj.marker.material.emissive.set('#17a36d');$('status').textContent='Procedure complete: '+steps.join(' → ')+'. Interact again for the knowledge check.';updateProgress();return}if(correct.has(index)){$('status').textContent='Knowledge check already passed. Choose another component.';return}
$('question').hidden=false;$('questionTitle').textContent=item.name;$('questionText').textContent=item.question;const answers=$('answers');answers.replaceChildren();item.answers.forEach((answer,i)=>{const b=document.createElement('button');b.textContent=answer;b.onclick=()=>{attempted.add(index);if(i===item.correct){correct.add(index);$('status').textContent='Correct! '+item.feedback}else{$('status').textContent='Not quite. '+item.feedback+' Interact again to retry this question.'} $('question').hidden=true;updateProgress()};answers.append(b)})}
const raycaster=new THREE.Raycaster();const pointer=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>9)drag.moved=true;if(drag.moved){yaw-=dx*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch-dy*.004))}drag.x=e.clientX;drag.y=e.clientY});
canvas.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.moved){const rect=canvas.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(objects.flatMap(o=>[o.m,o.marker]));if(hits.length){const hit=hits[0];if(camera.position.distanceTo(hit.object.position)<4.5)choose(hit.object.userData.index);else $('status').textContent='Move closer to inspect this object.'}}drag=null});
canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('lostpointercapture',()=>drag=null);
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();pressed.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e')interact()});window.addEventListener('keyup',e=>pressed.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{pressed.clear();drag=null});document.addEventListener('visibilitychange',()=>{if(document.hidden){pressed.clear();drag=null}});
const analog={move:{x:0,y:0},look:{x:0,y:0}};
function stick(id,key){const el=$(id),knob=el.querySelector('.knob');let active=null;function reset(){active=null;analog[key].x=0;analog[key].y=0;knob.style.transform='translate(0,0)'}function update(e){const box=el.getBoundingClientRect(),radius=box.width*.3;let x=(e.clientX-box.left-box.width/2)/radius,y=(e.clientY-box.top-box.height/2)/radius;const mag=Math.hypot(x,y);if(mag>1){x/=mag;y/=mag}analog[key].x=Math.abs(x)<.08?0:x;analog[key].y=Math.abs(y)<.08?0:y;knob.style.transform='translate('+(x*radius)+'px,'+(y*radius)+'px)'}el.addEventListener('pointerdown',e=>{if(active!==null)return;e.preventDefault();active=e.pointerId;el.setPointerCapture(active);update(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===active){e.preventDefault();update(e)}});['pointerup','pointercancel','lostpointercapture'].forEach(event=>el.addEventListener(event,e=>{if(e.pointerId===active)reset()}));window.addEventListener('blur',reset);document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()})}
stick('moveStick','move');stick('lookStick','look');
$('interact').onclick=interact;$('reset').onclick=build;$('scenario').onchange=e=>{mode=e.target.value;build()};
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;
yaw-=analog.look.x*2*dt;pitch=Math.max(-1.2,Math.min(1.2,pitch-analog.look.y*1.5*dt));camera.rotation.set(pitch,yaw,0,'YXZ');const f=Number(pressed.has('w')||pressed.has('arrowup')||pressed.has('forward'))-Number(pressed.has('s')||pressed.has('arrowdown')||pressed.has('back'));const r=Number(pressed.has('d')||pressed.has('arrowright')||pressed.has('right'))-Number(pressed.has('a')||pressed.has('arrowleft')||pressed.has('left'));const moveF=THREE.MathUtils.clamp(f-analog.move.y,-1,1),moveR=THREE.MathUtils.clamp(r+analog.move.x,-1,1);const len=Math.max(1,Math.hypot(moveF,moveR));const speed=4*dt/len;const oldX=camera.position.x,oldZ=camera.position.z;camera.position.x+=(-Math.sin(yaw)*moveF+Math.cos(yaw)*moveR)*speed;camera.position.z+=(-Math.cos(yaw)*moveF-Math.sin(yaw)*moveR)*speed;camera.position.x=THREE.MathUtils.clamp(camera.position.x,-10,10);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-10,10);for(const obj of objects){const p=obj.m.position;if(Math.abs(camera.position.x-p.x)<.8&&Math.abs(camera.position.z-p.z)<.8){camera.position.x=oldX;camera.position.z=oldZ;break}}
objects.forEach((o,i)=>{o.marker.position.y=2.6+Math.sin(now*.002+i)*.12;o.marker.rotation.y+=dt});
const width=canvas.clientWidth,height=canvas.clientHeight;if(width<1||height<1)return;if(canvas.width!==Math.round(width*renderer.getPixelRatio())||canvas.height!==Math.round(height*renderer.getPixelRatio())){renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix()}renderer.render(scene,camera)}
build();requestAnimationFrame(animate);
</script></body></html>
