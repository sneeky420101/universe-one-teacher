plugins { id 'com.android.application' }

android {
  namespace 'com.voltframe.teacher.preview'
  compileSdk 35
  defaultConfig {
    applicationId 'com.voltframe.teacher.preview'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '0.1.0-preview'
  }
  buildTypes { release { minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

/*
 * Bundle the offline classroom in every local/CI Android build.
 * Do not rely on a separate CI copy step: otherwise local APKs can be blank.
 */
def classroomRoot = rootProject.projectDir.parentFile
def classroomAssets = ['index.html','quest.html','tutorial.html','privacy.html',
  'global.html','pathways.html','campus.html','sw.js','manifest.webmanifest','icon.svg']
tasks.register('stageClassroomAssets', Copy) {
  from(classroomRoot) {
    include classroomAssets
    include 'curriculum/catalog.json'
  }
  into layout.projectDirectory.dir('src/main/assets')
}
tasks.configureEach { task ->
  if (task.name == 'preBuild') task.dependsOn('stageClassroomAssets')
}
