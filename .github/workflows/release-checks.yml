name: Android and Quest release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check sw.js
          for file in tests/*.test.js; do node --check "$file"; done
      - name: Run application and HTTP smoke tests
        run: npm test
      - name: Verify static release assets
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(m.start_url!=='./'||m.scope!=='./'||m.display!=='standalone')throw Error('PWA manifest misconfigured');
          for(const f of ['index.html','quest.html','tutorial.html','privacy.html','global.html','pathways.html','campus.html','sw.js','icon.svg'])if(!fs.statSync(f).size)throw Error('Empty asset: '+f);
          const h=fs.readFileSync('index.html','utf8');
          for(const f of ['tutorial.html','privacy.html','quest.html','manifest.webmanifest'])if(!h.includes(f))throw Error('Missing link: '+f);
          NODE
