name: Gameplay and security tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated tests
        run: npm test
      - name: Run release audit
        run: npm run release:audit
      - name: Run security audit
        run: npm run security:audit
