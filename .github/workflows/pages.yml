name: Verify and prepare static educational preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: teacher-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Run HTTP smoke tests
        run: node --test tests/http-smoke.test.js
      - name: Check required PWA files
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon.svg
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));if(!m.name||!m.start_url)process.exit(1)"
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package only public website files
        run: |
          mkdir -p public
          cp index.html quest.html global.html pathways.html campus.html sw.js manifest.webmanifest icon.svg public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
