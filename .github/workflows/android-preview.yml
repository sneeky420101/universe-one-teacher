name: Build Android debug preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit tracked files for credentials
        run: npm run security:audit
      - name: Run Node tests
        run: npm test
      - name: Build debug APK (not Play release)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK contains offline classroom and curriculum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apks=list(Path('android/app/build/outputs/apk/debug').glob('*.apk'))
          if len(apks)!=1: raise SystemExit('Expected exactly one debug APK')
          with zipfile.ZipFile(apks[0]) as apk:
              names=set(apk.namelist())
              required={'assets/index.html','assets/quest.html','assets/privacy.html','assets/curriculum/catalog.json'}
              missing=required-names
              if missing: raise SystemExit('APK missing offline assets: '+', '.join(sorted(missing)))
              for name in required:
                  if not apk.read(name): raise SystemExit('APK asset empty: '+name)
          print('Offline classroom assets verified in APK')
          PY
      # Debug APKs are sensitive preview artifacts; retain briefly and do not build on untrusted PRs.
      - uses: actions/upload-artifact@v4
        with:
          name: voltframe-teacher-debug-apk
          retention-days: 1
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
