name: Universe One Gameplay CI
on:
  pull_request:
    paths:
      - '*.html'
      - 'tests/**'
      - 'scripts/**'
      - 'curriculum/**'
      - 'package.json'
      - '.github/workflows/gameplay-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all repository tests and curriculum validation
        run: npm test
      - name: Run security audit
        run: npm run security:audit
      - name: Check release readiness without overriding hold
        shell: bash
        run: |
          set +e
          npm run release:audit
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Release audit: all gates satisfied (no deployment performed).'
          elif [ "$status" -eq 1 ]; then
            echo 'Release audit: intentionally blocked by outstanding release gates.'
            echo 'This is not a gameplay or security test failure.'
          else
            echo "Release audit failed unexpectedly (exit $status)." >&2
            exit "$status"
          fi
