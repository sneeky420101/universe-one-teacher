name: Universe One Gameplay CI
on:
  pull_request:
    paths:
      - '*.html'
      - 'tests/**'
      - 'scripts/**'
      - 'curriculum/**'
      - 'package.json'
      - '.github/workflows/gameplay-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all repository tests and curriculum validation
        run: npm test
      - name: Run release audit (non-deploying)
        run: npm run release:audit
      - name: Run security audit
        run: npm run security:audit
