<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe One — Shared Workshop</title><style>body{font:17px system-ui;background:#0a1930;color:white;margin:0;padding:82px 16px 30px}main{max-width:950px;margin:auto}canvas{width:100%;height:420px;touch-action:none;background:#142f43;border-radius:14px}button,input{font:inherit;padding:12px;border-radius:9px;margin:4px}button{background:#74e0be;border:0;color:#072d27;cursor:pointer}button:focus-visible{outline:3px solid #ffdf83}#home{position:fixed;top:10px;left:10px;width:62px;height:62px;border-radius:50%;background:#123554}#home img{width:100%}.panel{background:#213b59;border-radius:12px;padding:14px;margin:10px 0}#feedback{min-height:24px}</style><a id="home" href="./index.html" aria-label="Home"><img src="./universe-home-logo.svg" alt=""></a><main><h1>Shared Automotive Workshop — Network Alpha</h1><p>Join from two browsers using the same world code. Move around and interact with shared parts. Geometry is illustrative, not a realistic vehicle model.</p><div class="panel"><button id="create">Create world</button><input id="code" placeholder="World code" aria-label="World code"><button id="join">Join world</button><p id="feedback" role="status"></p><p id="details"></p></div><canvas id="view" width="900" height="420" aria-label="Top-down workshop scene"></canvas><div class="panel"><p>Move: arrow keys, WASD, or direction buttons. Select an item, then choose an action.</p><div id="move"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div><select id="part" aria-label="Workshop component"><option value="battery">Battery</option><option value="negative_terminal">Negative terminal</option><option value="positive_terminal">Positive terminal</option><option value="fuse_box">Fuse box</option></select><select id="tool" aria-label="Tool"><option value="scanner">Scanner</option><option value="wrench">Training wrench</option></select><button id="inspect">Inspect</button><button id="remove">Remove</button><button id="release">Release</button></div></main><script>
const $=x=>document.getElementById(x);let id='',token='',me='',world=null,timer=null;const canvas=$('view'),ctx=canvas.getContext('2d');const parts={battery:[0,0],negative_terminal:[.2,0],positive_terminal:[-.2,0],fuse_box:[.7,.4]};
async function api(data){const res=await fetch('/api/world',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await res.json();if(!res.ok)throw Error(out.error||'Network error');return out}
async function update(data){try{const out=await api(data);if(out.id){id=out.id;token=out.token;me=out.playerId;$('code').value=id;clearInterval(timer);timer=setInterval(poll,900)}world=out.world;draw();$('details').textContent='World: '+id+' · Players: '+out.players+' · Revision: '+out.revision;$('feedback').textContent=out.ok===false?out.reason:'Connected'}catch(e){$('feedback').textContent=e.message}}
async function poll(){if(!id)return;try{const res=await fetch('/api/world?id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token));if(res.ok){const data=await res.json();world=data.world;draw();$('details').textContent='World: '+id+' · Players: '+data.players+' · Revision: '+data.revision}}catch{}}
function draw(){if(!world)return;ctx.clearRect(0,0,900,420);ctx.fillStyle='#173d46';ctx.fillRect(0,0,900,420);ctx.strokeStyle='#366879';for(let x=0;x<900;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,420);ctx.stroke()}for(let y=0;y<420;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}const xy=p=>[450+p[0]*85,210+p[2]*85];for(const [part,offset] of Object.entries(parts)){const p=[offset[0],1,offset[1]],v=xy(p);ctx.fillStyle=world.components[part].removed?'#777':'#e0b55e';ctx.fillRect(v[0]-24,v[1]-18,48,36);ctx.fillStyle='white';ctx.font='13px system-ui';ctx.fillText(part.replace('_',' '),v[0]-35,v[1]-25)}for(const [pid,p] of Object.entries(world.players)){const v=xy(p.position);ctx.beginPath();ctx.arc(v[0],v[1],14,0,Math.PI*2);ctx.fillStyle=pid===me?'#79ffca':'#7aa8ff';ctx.fill();ctx.fillStyle='#061b28';ctx.font='12px system-ui';ctx.fillText(pid===me?'YOU':'STUDENT',v[0]-22,v[1]+30)}}
$('create').onclick=()=>update({action:'create'});$('join').onclick=()=>update({action:'join',id:$('code').value.trim()});for(const action of ['inspect','remove','release'])$(action).onclick=()=>update({id,token,action,partId:$('part').value,tool:$('tool').value});
async function move(dir){if(!world||!world.players[me])return;const p=world.players[me].position.slice(),delta={up:[0,0,-.4],down:[0,0,.4],left:[-.4,0,0],right:[.4,0,0]}[dir];p[0]+=delta[0];p[2]+=delta[2];await update({id,token,action:'move',position:p})}
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const dir={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];if(dir){e.preventDefault();move(dir)}});
</script></html>
